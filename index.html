<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>المتجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Lalezar&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FAF6F0; --surface:#FFFFFF; --text:#2B2320;
    --accent:#6B2D5C; --accent-dark:#552348; --gold:#C9A15A;
    --border:#E8DFD3; --muted:#8A7F72;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;}
  header{border-bottom:2px solid var(--border);padding:28px 24px;display:flex;align-items:center;gap:12px;}
  header .logo{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--bg);font-size:20px;flex-shrink:0;}
  header h1{font-family:'Lalezar',sans-serif;font-weight:400;font-size:2rem;margin:0;}
  main{max-width:1100px;margin:0 auto;padding:40px 24px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;}
  .card .img-wrap{aspect-ratio:1/1;background:#F1EBE1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .card img{width:100%;height:100%;object-fit:cover;}
  .card .body{padding:16px;}
  .card h3{margin:0 0 6px;font-size:1.1rem;}
  .card p{margin:0 0 12px;color:var(--muted);font-size:.9rem;line-height:1.5;}
  .tag{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1px dashed var(--gold);border-radius:10px;padding:6px 12px;font-weight:700;color:var(--accent);}
  .tag .dot{width:8px;height:8px;border-radius:50%;background:var(--bg);border:1px solid var(--gold);}
  .empty{text-align:center;padding:100px 20px;border:2px dashed var(--border);border-radius:18px;color:var(--muted);}
  .empty.error{color:#B04A3F;border-color:#e7c9c3;}
</style>
</head>
<body>

<header>
  <div class="logo">🛍</div>
  <h1 id="storeName">المتجر</h1>
</header>

<main>
  <div id="grid" class="grid"></div>
</main>

<script src="config.js"></script>
<script>
async function loadProducts() {
  const grid = document.getElementById('grid');
  const { data, error } = await supabaseClient
    .from('products')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    grid.innerHTML = `<div class="empty error">تعذر تحميل المنتجات. تأكد من إعداد الاتصال في config.js</div>`;
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    grid.innerHTML = `<div class="empty">لا توجد منتجات معروضة حاليًا</div>`;
    return;
  }

  grid.innerHTML = data.map(p => `
    <div class="card">
      <div class="img-wrap">
        ${p.image_url ? `<img src="${p.image_url}" alt="${escapeHtml(p.name)}">` : ''}
      </div>
      <div class="body">
        <h3>${escapeHtml(p.name)}</h3>
        ${p.description ? `<p>${escapeHtml(p.description)}</p>` : ''}
        <span class="tag"><span class="dot"></span>${escapeHtml(p.price)}</span>
      </div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

loadProducts();
</script>
</body>
</html>
